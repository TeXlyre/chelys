[package]
name = "chelys-app"
version = "2.0.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "chelys_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["tray-icon"] }

tauri-plugin-clipboard-manager = "2.4.1"
tauri-plugin-opener = "2.7.0"
tauri-plugin-os = "2.4.0"
tauri-plugin-positioner = "2.4.0"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-fs = "2.6.0"
tauri-plugin-persisted-scope = "2.4.0"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.24.1", features = ["v4"] }
thiserror = "2.0.20"


tokio = { version = "1.53.1", features = ["full"] }

sha2 = "0.10"
