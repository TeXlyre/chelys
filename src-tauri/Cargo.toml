[package]
name = "chelys-app"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "chelys_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }

tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-os = "2.3.2"
tauri-plugin-positioner = "2.3.3"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-persisted-scope = "2.3.7"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
keyring = "4.1.6"
uuid = { version = "1.24.1", features = ["v4"] }
thiserror = "2.0.20"

# 0.20.x is a breaking rewrite. 0.17.2 is the newest compatible architecture.
webrtc = "0.17.2"

tokio = { version = "1.53.1", features = ["full"] }
dashmap = "6.2.1"
bytes = "1.12.1"
axum = "0.8.9"
